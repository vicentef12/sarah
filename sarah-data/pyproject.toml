[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sarah-data"
version = "0.1.0"
description = "Data access layer for Sarah"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
]

[tool.setuptools]
packages = [
    "database",
    "models",
    "repositories",
]
